name: Website checks (no deployment)
on:
  pull_request:
  push:
    branches: ['feat/astra-playground-20260916']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit and syntax checks
        run: |
          node --test tests/*.test.mjs
          node --experimental-vm-modules scripts/check-modules.mjs
          for file in website/assets/*.mjs scripts/*.mjs; do node --check "$file"; done
      - name: Install the test browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium ffmpeg
      - name: Verify HTTP asset bytes at root and repository subpath
        run: python tests/http_assets.py
      - name: Real HTTP browser checks, including repository subpath
        run: python tests/browser_smoke.py --record
      - name: Visual proportions, copy and accessible controls
        run: python tests/visual_smoke.py
      - name: Capture final interface in both languages
        run: python tests/capture.py
      - name: Build and verify the standalone preview
        run: |
          python scripts/build-preview.py
          python tests/preview_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-validation
          path: evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: papertodo-workbench-website
          path: website/
